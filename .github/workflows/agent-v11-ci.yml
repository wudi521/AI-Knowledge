name: Agentic RAG V1.1 CI

on:
  push:
    branches:
      - refactor/knowledge-platform-business-p0
    paths:
      - 'yudao-framework/yudao-common/**'
      - 'yudao-module-ingestion/**'
      - 'yudao-module-evidence/**'
      - 'yudao-module-retrieval/**'
      - 'yudao-module-knowledge/**'
      - 'yudao-module-model/**'
      - 'docs/Agentic-RAG-V1.1-架构设计.md'
      - 'docs/Agentic-RAG-V1.1-实施验收.md'
      - 'docs/Agentic-RAG-V1.1-Structured-Core-封板.md'
      - '.github/workflows/agent-v11-ci.yml'
  pull_request:
    branches:
      - refactor/knowledge-platform-business-p0
    paths:
      - 'yudao-framework/yudao-common/**'
      - 'yudao-module-ingestion/**'
      - 'yudao-module-evidence/**'
      - 'yudao-module-retrieval/**'
      - 'yudao-module-knowledge/**'
      - 'yudao-module-model/**'
      - 'docs/Agentic-RAG-V1.1-架构设计.md'
      - 'docs/Agentic-RAG-V1.1-实施验收.md'
      - 'docs/Agentic-RAG-V1.1-Structured-Core-封板.md'
      - '.github/workflows/agent-v11-ci.yml'
  workflow_dispatch:

jobs:
  agent-v11-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile domain plugin pipelines
        run: >-
          mvn -B
          -pl yudao-module-ingestion/yudao-module-ingestion-server,yudao-module-retrieval/yudao-module-retrieval-server,yudao-module-evidence/yudao-module-evidence-server
          -am
          -DskipTests
          package

      - name: Run domain plugin pipeline tests
        run: >-
          mvn -B -q
          -pl yudao-module-ingestion/yudao-module-ingestion-server,yudao-module-retrieval/yudao-module-retrieval-server,yudao-module-evidence/yudao-module-evidence-server
          -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=DomainPluginResolverTest,DomainChunkingPipelineTest,RetrievalRecallPipelineTest,RetrievalScopePipelineTest,PatentExactIdentifierScopePluginTest,RetrievalFusionPipelineTest,RetrievalRerankPipelineTest,PatentRerankPluginTest,DomainQueryPolicyRegistryTest,PluginAgentGoalEvaluatorTest
          test

      - name: Run Agent V1.1 contract tests
        run: >-
          mvn -B -q
          -pl yudao-module-evidence/yudao-module-evidence-server
          -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=AgentExecutionStateTest,AgentExecutionGuardTest,AgenticQueryEngineTrustedScopeTest,AgenticQueryEngineSelfRepairTest,AgenticQueryEngineGoalEvaluatorTest,AgenticKnowledgeRuntimeEngineTest,CandidateTrustedScopeIsolationTest,AgentRuntimeExecutorTest,AgentDagCompositionTest,PublicRuntimeArchitectureTest,CapabilityInvokerTest,CapabilityRuntimeRetryTest,CapabilityResultStatusTest,CandidateEntityIdDerivationTest,CapabilityVisibilityPolicyTest,RelationTraversalCapabilityTest,KnowledgeRetrievalCapabilityTest,ExactTextSearchCapabilityTest,StructuredQueryCapabilityTest,StructuredPipelineCapabilityIntegrationTest,PatentPublicRuntimeCapabilityMatrixTest,StructuredPipelineProjectionSemanticsTest,StructuredPipelineErrorClassificationTest,StructuredValueEvaluatorTest,StructuredPipelineMultiValueMembershipTest,SimilarFieldValuesCapabilityTest,PatentClaimLookupCapabilityTest,PatentStructuredSchemaContractTest,CandidateFeedbackGuardTest,EvidenceQueryRouterTest,AgentV11AcceptanceMatrixTest,QueryTraceStageStoreTest,EvidenceRecorderConfidenceTest
          test

      - name: Print failing Surefire reports
        if: failure()
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' file; do
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]' "$file"; then
              found=1
              echo "===== $file ====="
              cat "$file"
            fi
          done < <(find . -path '*/target/surefire-reports/*.txt' -type f -print0)
          if [ "$found" -eq 0 ]; then
            echo 'No failing Surefire text report found; inspect Maven failure above.'
          fi
