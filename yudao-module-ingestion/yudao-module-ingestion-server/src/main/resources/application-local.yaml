# 入库管线 本地开发配置(与《8-中间件清单-本机Docker.md》对应, 实测 9/9 healthy)
spring:
  cloud:
    openfeign: # 通知审核(notifyParsed)为同步长调用(多批次LLM抽取), 读超时放宽到 5 分钟
      client:
        config:
          knowledge-server:
            connect-timeout: 10000
            read-timeout: 300000
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      username: # Nacos 账号
      password: # Nacos 密码
      discovery: # 【注册中心】配置项
        namespace: dev # 命名空间
        group: DEFAULT_GROUP
      config: # 【配置中心】配置项
        namespace: dev
        group: DEFAULT_GROUP
  datasource: # 数据库: MySQL 8 / 库 ruoyi-vue-pro / root-123456
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
    dynamic:
      primary: master
      datasource:
        master:
          name: ruoyi-vue-pro
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave: # 开发环境从库指向同一实例
          name: ruoyi-vue-pro
          lazy: true
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
  redis: # Redis 7.0 :6379
    host: 127.0.0.1
    port: 6379
    database: 0
  kafka: # Kafka 3.7.1 :9092
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"   # 允许反序列化任意包(开发环境)
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  elasticsearch: # Elasticsearch 8.13.4 :9200
    uris: http://127.0.0.1:9200

# Milvus 2.4.13 :19530(向量召回, 技术方案 5.3)
yudao:
  security:
    internal-auth: # 内部 RPC 认证(login-user 防伪造): 启用后带 login-user 头的请求必须附有效内部签名
      enabled: true
      secret-key: ${YUDAO_INTERNAL_AUTH_SECRET:dev-internal-secret-2026} # 生产必须环境变量覆盖
      timestamp-window-seconds: 300
  ai:
    milvus:
      host: 127.0.0.1
      port: 19530
      collection: ai_chunk_vector   # 向量集合名
      dim: 1024                     # BGE-M3 向量维度
    es:
      index: ai_chunk_bm25          # BM25 索引名
  ingestion:
    download: # 文件下载安全(SSRF防护): 只允许从白名单主机下载; MinIO 生产地址需加入白名单
      allowed-hosts: 127.0.0.1,localhost
      max-file-bytes: 104857600 # 100MB
    parser:
      mineru: # MinerU 文档解析服务(docker-compose mineru 服务, 需 GPU 效果最佳)
        enabled: false              # 部署 MinerU 后改为 true, PDF/扫描件自动走 MinerU 结构化解析
        base-url: http://127.0.0.1:18111
        timeout-ms: 300000
        max-pages: 200


# 定时任务(本地环境关闭 xxl-job 调度中心, 对齐芋道)
xxl:
  job:
    enabled: false # 是否开启调度中心，默认为 true 开启
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin # 调度中心部署跟地址
