# 对话工作台 本地开发配置(与《8-中间件清单-本机Docker.md》对应, 实测 9/9 healthy)
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      username: # Nacos 账号
      password: # Nacos 密码
      discovery: # 【注册中心】配置项
        namespace: dev # 命名空间
        group: DEFAULT_GROUP
      config: # 【配置中心】配置项
        namespace: dev
        group: DEFAULT_GROUP
    openfeign: # Feign 客户端超时(证据评估链路含多次 LLM 调用, CPU 推理 20~60s, 读超时放宽到 5 分钟, 对齐 knowledge 模块)
      client:
        config:
          evidence-server:
            connect-timeout: 10000
            read-timeout: 300000
          model-server:
            connect-timeout: 10000
            read-timeout: 300000
  datasource: # 数据库: MySQL 8 / 库 ruoyi-vue-pro / root-123456
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
    dynamic:
      primary: master
      datasource:
        master:
          name: ruoyi-vue-pro
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave: # 开发环境从库指向同一实例
          name: ruoyi-vue-pro
          lazy: true
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
  redis: # Redis 7.0 :6379
    host: 127.0.0.1
    port: 6379
    database: 0
  kafka: # Kafka 3.9 :9092
    bootstrap-servers: 127.0.0.1:9092


# 定时任务(本地环境关闭 xxl-job 调度中心, 对齐芋道)
xxl:
  job:
    enabled: false # 是否开启调度中心，默认为 true 开启
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin # 调度中心部署跟地址

# 对话工作台业务配置(接线任务 T1 落盘, 供后续任务读取)
yudao:
  security:
    internal-auth: # 内部 RPC 认证(login-user 防伪造): 启用后带 login-user 头的请求必须附有效内部签名
      enabled: true
      secret-key: ${YUDAO_INTERNAL_AUTH_SECRET:dev-internal-secret-2026} # 生产必须环境变量覆盖
      timestamp-window-seconds: 300
  chat:
    transfer:
      keywords:
        - 人工
        - 客服
        - 转人工
        - 投诉
        - 赔偿
        - 举报
      emotion-keywords:
        - 太差
        - 垃圾
        - 滚
        - 差评
        - 起诉
    channels:
      web:
        enabled: true
    max-context-messages: 6
