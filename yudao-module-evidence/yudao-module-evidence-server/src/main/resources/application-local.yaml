# 证据平台 本地开发配置(与《8-中间件清单-本机Docker.md》对应, 实测 9/9 healthy)
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      username: # Nacos 账号
      password: # Nacos 密码
      discovery: # 【注册中心】配置项
        namespace: dev # 命名空间
        group: DEFAULT_GROUP
      config: # 【配置中心】配置项
        namespace: dev
        group: DEFAULT_GROUP
    openfeign:
      client:
        config:
          model-server:
            connect-timeout: 10000
            read-timeout: 300000
          retrieval-server:
            connect-timeout: 10000
            read-timeout: 300000
  datasource:
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
    dynamic:
      primary: master
      datasource:
        master:
          name: ruoyi-vue-pro
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave:
          name: ruoyi-vue-pro
          lazy: true
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

xxl:
  job:
    enabled: false
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin

yudao:
  security:
    internal-auth:
      enabled: true
      secret-key: ${YUDAO_INTERNAL_AUTH_SECRET:dev-internal-secret-2026}
      timestamp-window-seconds: 300
  evidence:
    agent:
      # 公共 Agentic Knowledge Runtime 是唯一在线查询主链；旧 V3 mode 仅保留代码迁移兼容，不再 fallback。
      mode: AGENT
      max-steps: 6
      max-llm-calls: 6
      max-elapsed-ms: 15000
      capability-timeout-threads: 8
      environment: local
      write-allowed: false
    sufficiency:
      answer-threshold: 0.75
      consult-threshold: 0.5
      min-evidence-count: 2
      entity-consistency: true
      conflict-block: true
      weights:
        top-score: 0.5
        evidence-count: 0.3
        entity-coverage: 0.2
    dedup:
      similarity-threshold: 0.85
    claim:
      max-retry: 2
    slot:
      enabled: true
