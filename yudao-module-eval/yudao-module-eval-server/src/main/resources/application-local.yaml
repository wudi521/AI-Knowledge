# 评测平台 本地开发配置(与《8-中间件清单-本机Docker.md》对应, 实测 9/9 healthy)
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      username: # Nacos 账号
      password: # Nacos 密码
      discovery: # 【注册中心】配置项
        namespace: dev # 命名空间
        group: DEFAULT_GROUP
      config: # 【配置中心】配置项
        namespace: dev
        group: DEFAULT_GROUP
  datasource: # 数据库: MySQL 8 / 库 ruoyi-vue-pro / root-123456
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
    dynamic:
      primary: master
      datasource:
        master:
          name: ruoyi-vue-pro
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave: # 开发环境从库指向同一实例
          name: ruoyi-vue-pro
          lazy: true
          url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
  redis: # Redis 7.0 :6379
    host: 127.0.0.1
    port: 6379
    database: 0
  kafka: # Kafka 3.9 :9092
    bootstrap-servers: 127.0.0.1:9092
  elasticsearch: # Elasticsearch 8.13.4 :9200
    uris: http://127.0.0.1:9200


# 定时任务(本地环境关闭 xxl-job 调度中心, 对齐芋道)
xxl:
  job:
    enabled: false # 是否开启调度中心，默认为 true 开启
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin # 调度中心部署跟地址

# 评测平台业务配置
yudao:
  security:
    internal-auth: # 内部 RPC 认证(login-user 防伪造): 启用后带 login-user 头的请求必须附有效内部签名
      enabled: true
      secret-key: ${YUDAO_INTERNAL_AUTH_SECRET:dev-internal-secret-2026} # 生产必须环境变量覆盖
      timestamp-window-seconds: 300
  eval:
    model: evidence-v1 # 默认评测模型(发起评测任务时写入 ai_eval_task.model)
    gate:
      enabled: false # 评测闸门: P1 达标前关闭(测试环境不阻断发布); P1 落地后置 true 并跑通达标评测
      recall-at-5: 0.9
      mrr: 0.8
      ndcg: 0.8
      faithfulness: 0.95
      hallucination: 0.02
      citation-accuracy: 0.97
    runner:
      max-parallel: 2
      timeout-ms: 300000
